[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "dungeon-agent"
version = "0.1.0"
description = "Text-driven dungeon agent harness scaffold."
readme = "BRIEF.md"
requires-python = ">=3.14"
dependencies = [
  "openai>=1.68,<2.0",
  "pydantic>=2.7,<3.0",
  "rich>=13.9,<15.0",
]

[project.scripts]
dungeon-agent = "dungeon_agent.runner.cli:main"
dungeon-agent-replay = "dungeon_agent.runner.replay:main"
dungeon-agent-eval = "dungeon_agent.eval.harness:main"

[dependency-groups]
dev = [
  "pytest==8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"
